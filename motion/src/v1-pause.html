<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script src="common.js"></script><script>
// V1 "PAUSE" — dot → line → pause (‖) → bars open the wordmark → bars fold into one connecting line → tagline.
const SIZE = 150, LS = 16, CAP = SIZE * 0.727, WY = 500;
const WM = layout('INTERMISSION', SIZE, 700, LS);
const TAG = 'Creative, Connected.';
const LINE_Y = WY + CAP / 2 + 46;

// Rounded bar centred at (x,y), length along angle a.
function bar(x, y, len, th, a, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-len / 2, -th / 2, len, th, th / 2); ctx.fill(); ctx.restore();
}

function draw(t) {
  bg();
  const halfW = WM.total / 2;
  const sideX = halfW + 70;
  const outro = seg(t, 10.6, 11.5);

  // ---- bars: dot → line → pause → open → fold to line → collapse
  if (t < 1.3) {
    const k = E.outBack(seg(t, 0.35, 0.95));
    const pulse = 1 + 0.18 * Math.sin(seg(t, 0.95, 1.3) * Math.PI);
    ctx.fillStyle = C.blue; ctx.beginPath(); ctx.arc(CX, WY, 11 * k * pulse, 0, Math.PI * 2); ctx.fill();
  } else {
    const kLine = E.outExpo(seg(t, 1.3, 2.3));
    const kPause = E.inOutExpo(seg(t, 2.5, 3.3));
    const kOpen = E.inOutExpo(seg(t, 4.1, 5.1));
    const kFold = E.inOutExpo(seg(t, 5.9, 6.9));
    const kOut = E.inOutExpo(outro);
    for (const s of [-1, 1]) {
      const lineLen = lerp(22, halfW + 40, kLine);              // each half of the long line
      let x = CX + s * lerp(0, lineLen / 2, kLine), y = WY, len = lineLen, th = lerp(22, 8, kLine), a = 0;
      // fold into pause symbol
      x = lerp(x, CX + s * 34, kPause); len = lerp(len, 130, kPause); th = lerp(th, 26, kPause); a = lerp(0, Math.PI / 2, kPause);
      // slide apart to bracket the wordmark
      x = lerp(x, CX + s * sideX, kOpen); len = lerp(len, CAP * 1.5, kOpen); th = lerp(th, 10, kOpen);
      // fold down into one underline connecting both sides
      x = lerp(x, CX + s * (halfW / 2), kFold); y = lerp(y, LINE_Y, kFold);
      len = lerp(len, halfW + 2, kFold); th = lerp(th, 5, kFold); a = lerp(a, 0, kFold);
      // outro: back to centre dot
      x = lerp(x, CX + s * 6, kOut); y = lerp(y, WY, kOut); len = lerp(len, 12, kOut); th = lerp(th, 22, kOut);
      const fade = 1 - seg(t, 11.5, 11.9);
      ctx.globalAlpha = fade; bar(x, y, len, th, a, C.blue); ctx.globalAlpha = 1;
    }
  }

  // ---- wordmark letters rise through a mask, centre-out stagger; drop out on outro
  ctx.save(); ctx.beginPath(); ctx.rect(0, WY - CAP / 2 - 12, W, CAP + 24); ctx.clip();
  setFont(SIZE, 700, 0); ctx.fillStyle = C.fg; ctx.textBaseline = 'alphabetic';
  WM.g.forEach((l, i) => {
    const d = Math.abs(i - 5.5) * 0.055;
    const kin = E.outExpo(seg(t, 4.35 + d, 5.25 + d));
    const kout = E.inExpo(seg(t, 10.45 + (0.33 - d / 2) * 0.6, 10.95 + (0.33 - d / 2) * 0.6));
    const y = WY + CAP / 2 + (1 - kin) * (CAP + 30) + kout * (CAP + 30);
    ctx.fillText(l.ch, l.x, y);
  });
  ctx.restore();

  // ---- tagline: words rise in, then dissolve
  setFont(40, 300, 4, 'Inter');
  const tg = layout(TAG, 40, 300, 4);
  const words = [[0, 9], [9, TAG.length]];
  ctx.save(); ctx.beginPath(); ctx.rect(0, LINE_Y + 30, W, 70); ctx.clip();
  words.forEach(([a, b], wi) => {
    const k = E.outExpo(seg(t, 7.0 + wi * 0.28, 7.9 + wi * 0.28));
    ctx.globalAlpha = k * (1 - E.outCubic(seg(t, 10.3, 10.8)));
    ctx.fillStyle = wi ? C.fg : '#A9A7A2';
    for (let i = a; i < b; i++) ctx.fillText(tg.g[i].ch, tg.g[i].x, LINE_Y + 82 + (1 - k) * 50);
  });
  ctx.restore(); ctx.globalAlpha = 1;
}
window.ready = true;
</script></body></html>
